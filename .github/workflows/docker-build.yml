name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t ops-toolkit:ci .

      - name: 查看镜像
        run: docker images ops-toolkit

      - name: 运行容器测试
        run: docker run --rm ops-toolkit:ci python --version
        