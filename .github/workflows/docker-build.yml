name: Docker Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 pytest
        run: pip install pytest

      - name: 运行单元测试
        run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t ops-toolkit:ci .

      - name: 查看镜像
        run: docker images ops-toolkit

      - name: 运行容器测试
        run: docker run --rm ops-toolkit:ci --help
        
  publish:
    needs: [test, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          TAGS="-t $IMAGE:latest -t $IMAGE:${{ github.sha }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAGS="$TAGS -t $IMAGE:${{ github.ref_name }}"
          fi
          docker build $TAGS .
          docker push --all-tags $IMAGE
  deploy-staging:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: STATE_FILE=$HOME/.ops-staging-current ./shell/deploy.sh ${{ github.sha }}