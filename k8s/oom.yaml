apiVersion: v1
kind: Pod
metadata:
  name: oom-demo
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: python:3.12-slim
      command: ["python", "-c", "x = bytearray(200*1024*1024); print('allocated')"]
      resources:
        requests:
          memory: 32Mi
          cpu: 50m
        limits:
          memory: 64Mi
          cpu: 100m
          